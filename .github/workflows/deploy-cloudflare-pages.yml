name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment contract
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::warning title=Falta D1_DATABASE_ID::La variable D1_DATABASE_ID no está definida. Se saltará la sincronización de base de datos."
          fi
          if [ ! -f package-lock.json ]; then
            echo "No existe package-lock.json; el pipeline usa npm ci y requiere lockfile npm."
            exit 1
          fi
          if [ -f pnpm-lock.yaml ]; then
            echo "Se detectó pnpm-lock.yaml junto con package-lock.json; mantiene ambigüedad de gestor."
            echo "Define solo package-lock.json para este proyecto."
            exit 1
          fi
          if grep -q "REEMPLAZAR_DATABASE_ID" wrangler.toml; then
            echo "wrangler.toml contiene placeholder REEMPLAZAR_DATABASE_ID."
            exit 1
          fi
          if [ ! -f functions/api/admin/editions.ts ]; then
            echo "::warning title=Falta API Admin::Falta la ruta de API /api/admin/editions."
          fi
          if ! grep -q "admin_editions" database/community.sql; then
            echo "::warning title=Falta tabla Admin Editions::El esquema D1 no incluye tabla admin_editions."
          fi

      - name: Build app
        run: npm run build

      - name: Run lint (master branch validation)
        if: github.event_name == 'push'
        run: npm run lint || true

      - name: Sync D1 schema (master branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.CLOUDFLARE_D1_DATABASE_NAME != ''
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          npx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" \
            --account-id "$CF_ACCOUNT_ID" \
            --remote \
            --file=database/community.sql

      - name: Publish to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'yosoymx' }}
            --branch=master
