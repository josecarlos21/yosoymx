name: GacetaIOS
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MZBY6QGSMU
    CODE_SIGN_ENTITLEMENTS: GacetaIOS/GacetaIOS.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.yosoymx.gacetaejecentral
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 3
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: GacetaIOS/Info.plist
    API_BASE_URL: https://yosoymx.com/api
    API_ENVIRONMENT: production
targets:
  GacetaIOS:
    type: application
    platform: iOS
    sources:
      - path: GacetaIOS/Sources
      - path: GacetaIOS/Resources
        buildPhase: resources
      - path: ../app/shared/content/issue-content.json
        buildPhase: resources
      - path: ../app/shared/content/community-fixtures.json
        buildPhase: resources
      - path: ../app/shared/content/brand-config.json
        buildPhase: resources
      - path: ../app/shared/design/tokens.json
        buildPhase: resources
      - path: ../app/public/photos
        buildPhase: resources
      - path: ../app/public/pdfs
        buildPhase: resources
  GacetaIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GacetaIOSTests
      - path: GacetaIOS/Sources/AppRouting.swift
      - path: GacetaIOS/Sources/Models.swift
      - path: GacetaIOS/Sources/Services.swift
      - path: GacetaIOS/Sources/Theme.swift
    settings:
      base:
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  GacetaIOS:
    build:
      targets:
        GacetaIOS: all
    test:
      gatherCoverageData: false
      targets:
        - GacetaIOSTests
